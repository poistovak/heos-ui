name: CI

on:
  push:
    branches:
      - master
      - main
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - run: python -m pip install --upgrade pip
      - run: pip install pytest ruff

      - run: ruff check .

      - run: python packages/design-tokens/validator/validate.py

      - run: pytest packages/design-tokens/tests -v